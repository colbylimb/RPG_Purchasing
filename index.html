<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG Weekly Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;
  --surface:#ffffff;
  --surface-2:#ecebe5;
  --border:#dbdad2;
  --text:#21251f;
  --text-muted:#616b5f;
  --accent:#2f6c5c;
  --accent-contrast:#ffffff;
  --good:#2f8a55;
  --warn:#c8862a;
  --danger:#c1392b;
  --shadow:0 1px 2px rgba(30,35,30,.06), 0 6px 16px -8px rgba(30,35,30,.12);
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181a;
    --surface:#1c2225;
    --surface-2:#232a2d;
    --border:#313b3d;
    --text:#eef1ee;
    --text-muted:#9fada7;
    --accent:#59baa0;
    --accent-contrast:#0d1412;
    --good:#4fbd7c;
    --warn:#e0a53f;
    --danger:#e2685a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#14181a;
  --surface:#1c2225;
  --surface-2:#232a2d;
  --border:#313b3d;
  --text:#eef1ee;
  --text-muted:#9fada7;
  --accent:#59baa0;
  --accent-contrast:#0d1412;
  --good:#4fbd7c;
  --warn:#e0a53f;
  --danger:#e2685a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
#root{max-width:1100px;margin:0 auto;padding:28px 20px 64px;}
h1,h2,h3{font-family:"Libre Franklin", ui-sans-serif, system-ui, sans-serif;text-wrap:balance;margin:0;}
a{color:inherit;}
button{font-family:inherit;}
.rpg-header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border);
}
.rpg-eyebrow{
  font-family:"Public Sans";font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);margin:0 0 4px;
}
.rpg-title{font-size:26px;font-weight:700;color:var(--text);}
.rpg-nav{display:flex;gap:14px;align-items:center;font-size:13.5px;}
.rpg-nav a{color:var(--text-muted);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;}
.rpg-nav a:hover{color:var(--text);border-color:var(--border);}

.tile-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;
}
.tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);padding:22px 18px;text-decoration:none;color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  transition:transform .12s ease, box-shadow .12s ease;
  border-top:4px solid var(--tile-accent, var(--accent));
  cursor:pointer;
}
.tile:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(30,35,30,.08), 0 14px 28px -12px rgba(30,35,30,.22);}
.tile img{max-height:52px;max-width:100%;object-fit:contain;}
.tile .tile-name{font-family:"Libre Franklin";font-weight:600;font-size:15px;}
.tile .tile-cta{font-size:12px;color:var(--text-muted);}

.store-head{
  display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap;
}
.store-logo-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:10px 14px;box-shadow:var(--shadow);
}
.store-logo-wrap img{height:46px;display:block;}
.store-head-text .rpg-title{font-size:24px;}
.week-range{color:var(--text-muted);font-size:13.5px;margin-top:2px;}

.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px 20px;box-shadow:var(--shadow);
}
.kpi-label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);}
.kpi-value{font-family:"Libre Franklin";font-weight:800;font-size:30px;margin-top:6px;line-height:1.1;}
.kpi-sub{font-size:12.5px;color:var(--text-muted);margin-top:6px;}
.kpi.good .kpi-value{color:var(--good);}
.kpi.warn .kpi-value{color:var(--warn);}
.kpi.danger .kpi-value{color:var(--danger);}

.progress-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px 20px;box-shadow:var(--shadow);margin-bottom:22px;
}
.progress-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-muted);margin-bottom:8px;}
.progress-track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;background:var(--store-accent, var(--accent));transition:width .3s ease;}
.progress-fill.over{background:var(--danger);}

.day-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.day-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px 14px;box-shadow:var(--shadow);
}
.day-card.today{border-color:var(--store-accent, var(--accent));border-width:2px;padding:13px;}
.day-name{font-family:"Libre Franklin";font-weight:700;font-size:14px;}
.day-date{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
.day-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.day-row .lbl{color:var(--text-muted);}
.day-row .val{font-weight:600;}
.day-delta{font-size:11.5px;margin-top:6px;font-weight:600;}
.day-delta.good{color:var(--good);}
.day-delta.danger{color:var(--danger);}
.today-badge{
  display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--store-accent, var(--accent));color:#fff;border-radius:999px;padding:2px 8px;margin-bottom:6px;
}

.empty-note{
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-lg);
  padding:28px 22px;text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:22px;
}
.loading-note{color:var(--text-muted);font-size:14px;padding:40px 0;text-align:center;}

.rpg-footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;color:var(--text-muted);font-size:12px;flex-wrap:wrap;gap:8px;}
.rpg-footer a{color:var(--text-muted);text-decoration:none;}
.rpg-footer a:hover{color:var(--text);}

/* Admin */
.admin-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.admin-tab{
  border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;
}
.admin-tab.active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
.admin-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start;}
@media (max-width:820px){.admin-grid{grid-template-columns:1fr;}.kpi-row{grid-template-columns:1fr;}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px;}
.panel h2{font-size:16px;margin-bottom:14px;}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.field-row:last-child{border-bottom:none;}
.field-row label{font-size:13.5px;color:var(--text);}
.field-row .field-day{font-weight:600;}
.field-row .field-date{color:var(--text-muted);font-size:11.5px;display:block;}
.num-input{
  width:110px;padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg);color:var(--text);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums;
}
.num-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.weekly-budget-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.weekly-budget-row label{font-weight:700;font-size:14px;}
.weekly-budget-row .num-input{width:140px;font-size:16px;font-weight:700;}
.save-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
.btn{
  border:none;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;
  background:var(--accent);color:var(--accent-contrast);
}
.btn:disabled{opacity:.55;cursor:default;}
.btn.secondary{background:var(--surface-2);color:var(--text);}
.status-msg{font-size:13px;color:var(--text-muted);}
.status-msg.err{color:var(--danger);}
.status-msg.ok{color:var(--good);}
.carry-note{
  background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;
  color:var(--text-muted);margin-bottom:14px;
}
.col-heads{display:flex;justify-content:flex-end;gap:14px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding-bottom:6px;}
.col-heads span{width:110px;text-align:right;}
.setup-warn{
  background:#fff3cd;border:1px solid #e2c257;color:#5c4a06;border-radius:var(--radius-md);
  padding:14px 16px;font-size:13px;margin-bottom:22px;
}
</style>
</head>

  var STORE_BY_SLUG = {};
  STORES.forEach(function(s){ STORE_BY_SLUG[s.slug] = s; });

  var DAY_KEYS = ['mon','tue','wed','thu','fri','sat'];
  var DAY_LABELS = {mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};
  var WD_OFFSET = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};

  function pad2(n){ return (n < 10 ? '0' : '') + n; }

  function denverParts(date){
    var fmt = new Intl.DateTimeFormat('en-US', {
      timeZone:'America/Denver', year:'numeric', month:'2-digit', day:'2-digit', weekday:'short'
    });
    var parts = fmt.formatToParts(date);
    var map = {};
    parts.forEach(function(p){ map[p.type] = p.value; });
    return { y:+map.year, m:+map.month, d:+map.day, weekday: map.weekday };
  }
  function ymdToUTCNoon(y,m,d){ return new Date(Date.UTC(y, m-1, d, 12, 0, 0)); }
  function fmtYMD(dt){ return dt.getUTCFullYear() + '-' + pad2(dt.getUTCMonth()+1) + '-' + pad2(dt.getUTCDate()); }
  function fmtDisplayDate(dt){
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[dt.getUTCMonth()] + ' ' + dt.getUTCDate();
  }

  function getTodayInfo(){
    var now = new Date();
    var p = denverParts(now);
    var todayUTC = ymdToUTCNoon(p.y,p.m,p.d);
    var offset = WD_OFFSET[p.weekday];
    var mondayUTC = new Date(todayUTC.getTime() - offset*86400000);
    var weekStart = fmtYMD(mondayUTC);
    return { weekday: p.weekday, weekStart: weekStart, offset: offset, mondayUTC: mondayUTC, todayYMD: fmtYMD(todayUTC) };
  }

  function weekDates(mondayUTC){
    var out = {};
    DAY_KEYS.forEach(function(k, i){
      out[k] = new Date(mondayUTC.getTime() + i*86400000);
    });
    return out;
  }

  function money(n){
    n = Number(n)||0;
    var neg = n < 0;
    n = Math.abs(n);
    var s = n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
    return (neg?'-':'') + '$' + s;
  }

  function emptyDays(){
    var o = {};
    DAY_KEYS.forEach(function(k){ o[k] = {target:0, actual:0}; });
    return o;
  }
  function defaultRecord(){
    return { weekStart:null, weeklyBudget:0, days: emptyDays(), updatedAt:null };
  }

  // ---- data layer: Google Apps Script backend ----
  var state = { stores: {} };

  function loadState(cb){
    if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
      cb(new Error('not_configured'));
      return;
    }
    fetch(APPS_SCRIPT_URL, {method:'GET', cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data && data.ok && data.state){ state = data.state; }
        cb(null);
      })
      .catch(function(err){ cb(err); });
  }

  function saveRecord(slug, record, cb){
    fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({key:WRITE_KEY, slug:slug, record:record})
    }).then(function(r){ return r.json(); })
      .then(function(data){
        if(data && data.ok){ state = data.state; cb(null); }
        else { cb(new Error((data && data.error) || 'save_failed')); }
      })
      .catch(function(err){ cb(err); });
  }

  // ---- routing ----
  function parseRoute(){
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean);
    if(parts.length === 0) return {view:'home'};
    if(parts[0] === 'store' && parts[1]) return {view:'store', slug:parts[1]};
    if(parts[0] === 'admin') return {view:'admin', slug:parts[1] || null};
    return {view:'home'};
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'html') e.innerHTML = attrs[k];
      else if(k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){
      if(c == null) return;
      if(typeof c === 'string') e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  function footer(){
    return el('div',{class:'rpg-footer'},[
      el('span',{},['Robinson Pharmacy Group - Weekly Purchase Budget']),
      el('a',{href:'#/admin'},['Admin'])
    ]);
  }

  function render(){
    var root = document.getElementById('root');
    if(!root) return;
    root.innerHTML = '';
    root.appendChild(el('div',{class:'loading-note'},['Loading budget data...']));
    loadState(function(err){
      root.innerHTML = '';
      if(err){
        if(err.message === 'not_configured'){
          root.appendChild(el('div',{class:'setup-warn'},[
            "Setup needed: open this file and paste your Google Apps Script Web App URL into the APPS_SCRIPT_URL constant near the top of the <script> tag, then re-upload it."
          ]));
        } else {
          root.appendChild(el('div',{class:'empty-note'},["Can't reach the budget data right now. Check your connection and try again."]));
        }
        return;
      }
      var route = parseRoute();
      if(route.view === 'store' && STORE_BY_SLUG[route.slug]) renderStore(root, route.slug);
      else if(route.view === 'admin') renderAdmin(root, route.slug);
      else renderHome(root);
    });
  }

  window.addEventListener('hashchange', render);
  if(document.readyState === 'complete' || document.readyState === 'interactive'){ render(); }
  else{ document.addEventListener('DOMContentLoaded', render); }

  function renderHome(root){
    root.appendChild(el('div',{class:'rpg-header'},[
      el('div',{},[
        el('p',{class:'rpg-eyebrow'},['Robinson Pharmacy Group']),
        el('h1',{class:'rpg-title'},['Weekly Purchase Budget'])
      ]),
      el('div',{class:'rpg-nav'},[ el('a',{href:'#/admin'},['Admin']) ])
    ]));
    var grid = el('div',{class:'tile-grid'});
    STORES.forEach(function(s){
      var tile = el('a',{class:'tile', href:'#/store/'+s.slug, style:'--tile-accent:'+s.accent},[
        el('img',{src:s.logo, alt:s.name+' logo'}),
        el('div',{class:'tile-name'},[s.name]),
        el('div',{class:'tile-cta'},["View this week's budget ->"])
      ]);
      grid.appendChild(tile);
    });
    root.appendChild(grid);
    root.appendChild(footer());
  }

  function computeMetrics(rec, today){
    var isCurrent = rec.weekStart === today.weekStart;
    var ordered = 0;
    if(isCurrent){
      DAY_KEYS.forEach(function(k){ ordered += Number(rec.days[k].actual)||0; });
    }
    var remaining = (Number(rec.weeklyBudget)||0) - ordered;
    var availableToday = null;
    if(isCurrent && today.weekday !== 'Sun'){
      var key = DAY_KEYS[today.offset];
      if(key) availableToday = Number(rec.days[key].target)||0;
    }
    return { isCurrent:isCurrent, ordered:ordered, remaining:remaining, availableToday:availableToday };
  }

  function renderStore(root, slug){
    var store = STORE_BY_SLUG[slug];
    var rec = state.stores[slug] || defaultRecord();
    var today = getTodayInfo();
    var dates = weekDates(today.mondayUTC);
    var m = computeMetrics(rec, today);
    var accent = store.accent;

    root.appendChild(el('div',{class:'rpg-header'},[
      el('div',{},[
        el('p',{class:'rpg-eyebrow'},['Robinson Pharmacy Group']),
        el('h1',{class:'rpg-title'},['Weekly Purchase Budget'])
      ]),
      el('div',{class:'rpg-nav'},[ el('a',{href:'#/'},['All pharmacies']) ])
    ]));

    root.appendChild(el('div',{class:'store-head'},[
      el('div',{class:'store-logo-wrap'},[ el('img',{src:store.logo, alt:store.name+' logo'}) ]),
      el('div',{class:'store-head-text'},[
        el('h2',{class:'rpg-title'},[store.name]),
        el('div',{class:'week-range'},['Week of ' + fmtDisplayDate(dates.mon) + '-' + fmtDisplayDate(dates.sat) + (m.isCurrent ? '' : ' - not set up yet')])
      ])
    ]));

    if(!m.isCurrent || !rec.weeklyBudget){
      root.appendChild(el('div',{class:'empty-note'},[
        el('div',{},[ (rec.weeklyBudget && !m.isCurrent) ? ("This week's budget hasn't been set yet. Last known weekly budget was " + money(rec.weeklyBudget) + ".") : "This week's budget hasn't been set yet." ]),
        el('div',{style:'margin-top:6px;font-size:12.5px;'},['Ask operations to set it up in Admin.'])
      ]));
      root.appendChild(footer());
      return;
    }

    var pct = rec.weeklyBudget > 0 ? (m.ordered / rec.weeklyBudget) * 100 : 0;
    var over = m.remaining < 0;

    var kpiRow = el('div',{class:'kpi-row'});
    kpiRow.appendChild(el('div',{class:'kpi'},[
      el('div',{class:'kpi-label'},['Ordered so far this week']),
      el('div',{class:'kpi-value'},[money(m.ordered)]),
      el('div',{class:'kpi-sub'},['of ' + money(rec.weeklyBudget) + ' weekly budget'])
    ]));
    var todayKpi;
    if(today.weekday === 'Sun'){
      todayKpi = el('div',{class:'kpi'},[
        el('div',{class:'kpi-label'},['Available to order today']),
        el('div',{class:'kpi-value', style:'font-size:18px;'},['Closed Sundays']),
        el('div',{class:'kpi-sub'},['No order day scheduled'])
      ]);
    } else {
      todayKpi = el('div',{class:'kpi ' + (m.availableToday>0?'good':'')},[
        el('div',{class:'kpi-label'},['Available to order today']),
        el('div',{class:'kpi-value'},[money(m.availableToday)]),
        el('div',{class:'kpi-sub'},[DAY_LABELS[DAY_KEYS[today.offset]] + "'s recommended target"])
      ]);
    }
    kpiRow.appendChild(todayKpi);
    kpiRow.appendChild(el('div',{class:'kpi ' + (over?'danger':'good')},[
      el('div',{class:'kpi-label'},['Remaining this week']),
      el('div',{class:'kpi-value'},[money(m.remaining)]),
      el('div',{class:'kpi-sub'},[over ? 'Over the weekly budget' : 'Left to stay on budget']),
    ]));
    root.appendChild(kpiRow);

    root.appendChild(el('div',{class:'progress-wrap'},[
      el('div',{class:'progress-top'},[
        el('span',{},['Week used']),
        el('span',{},[Math.round(pct) + '%'])
      ]),
      el('div',{class:'progress-track'},[
        el('div',{class:'progress-fill' + (over?' over':''), style:'width:' + Math.min(100,Math.max(0,pct)) + '%; --store-accent:' + accent + ';'})
      ])
    ]));

    var dayGrid = el('div',{class:'day-grid'});
    DAY_KEYS.forEach(function(k, i){
      var d = rec.days[k];
      var isToday = m.isCurrent && today.offset === i && today.weekday !== 'Sun';
      var hasHappened = m.isCurrent && i <= today.offset && today.weekday !== 'Sun';
      var card = el('div',{class:'day-card' + (isToday?' today':''), style: isToday ? '--store-accent:'+accent+';' : ''});
      if(isToday) card.appendChild(el('span',{class:'today-badge', style:'background:'+accent+';'},['Today']));
      card.appendChild(el('div',{class:'day-name'},[DAY_LABELS[k]]));
      card.appendChild(el('div',{class:'day-date'},[fmtDisplayDate(dates[k])]));
      card.appendChild(el('div',{class:'day-row'},[el('span',{class:'lbl'},['Target']), el('span',{class:'val'},[money(d.target)])]));
      if(hasHappened){
        card.appendChild(el('div',{class:'day-row'},[el('span',{class:'lbl'},['Actual']), el('span',{class:'val'},[money(d.actual)])]));
        var delta = (Number(d.target)||0) - (Number(d.actual)||0);
        card.appendChild(el('div',{class:'day-delta ' + (delta>=0?'good':'danger')},[delta>=0 ? (money(delta)+' under') : (money(Math.abs(delta))+' over')]));
      }
      dayGrid.appendChild(card);
    });
    root.appendChild(dayGrid);
    root.appendChild(footer());
  }

  // ---- admin ----
  var adminDraft = {}; // slug -> working copy of record

  function renderAdmin(root, initialSlug){
    var slug = (initialSlug && STORE_BY_SLUG[initialSlug]) ? initialSlug : STORES[0].slug;
    var today = getTodayInfo();
    var dates = weekDates(today.mondayUTC);

    root.appendChild(el('div',{class:'rpg-header'},[
      el('div',{},[
        el('p',{class:'rpg-eyebrow'},['Robinson Pharmacy Group']),
        el('h1',{class:'rpg-title'},['Budget Admin'])
      ]),
      el('div',{class:'rpg-nav'},[ el('a',{href:'#/'},['All pharmacies']) ])
    ]));

    var tabs = el('div',{class:'admin-tabs'});
    STORES.forEach(function(s){
      tabs.appendChild(el('button',{
        class:'admin-tab' + (s.slug===slug?' active':''),
        onclick:function(){ location.hash = '#/admin/' + s.slug; }
      },[s.name]));
    });
    root.appendChild(tabs);

    var store = STORE_BY_SLUG[slug];
    var savedRec = state.stores[slug] || defaultRecord();
    var isCurrent = savedRec.weekStart === today.weekStart;

    if(!adminDraft[slug] || adminDraft[slug]._weekStart !== today.weekStart){
      var base = isCurrent ? savedRec : (savedRec.weekStart ? savedRec : defaultRecord());
      var draft = {
        weeklyBudget: base.weeklyBudget || 0,
        days: {},
        _weekStart: today.weekStart,
        _carried: (!isCurrent && !!savedRec.weekStart)
      };
      DAY_KEYS.forEach(function(k){
        draft.days[k] = {
          target: (base.days && base.days[k] && base.days[k].target) || 0,
          actual: isCurrent && base.days && base.days[k] ? (base.days[k].actual||0) : 0
        };
      });
      adminDraft[slug] = draft;
    }
    var draft = adminDraft[slug];

    var grid = el('div',{class:'admin-grid'});

    var formPanel = el('div',{class:'panel'});
    formPanel.appendChild(el('h2',{},['Week of ' + fmtDisplayDate(dates.mon) + '-' + fmtDisplayDate(dates.sat) + ' - ' + store.name]));
    if(draft._carried){
      formPanel.appendChild(el('div',{class:'carry-note'},["New week - carried forward last week's budget and targets. Update the actuals as invoices post, and adjust the budget if it's different this week."]));
    }
    formPanel.appendChild(el('div',{class:'weekly-budget-row'},[
      el('label',{},['Weekly budget']),
      el('input',{class:'num-input', type:'number', min:'0', step:'50', value:draft.weeklyBudget, oninput:function(e){ draft.weeklyBudget = e.target.value; renderPreview(); }})
    ]));
    formPanel.appendChild(el('div',{class:'col-heads'},[el('span',{},['Target']), el('span',{},['Actual ordered'])]));
    DAY_KEYS.forEach(function(k){
      var row = el('div',{class:'field-row'},[
        el('label',{},[
          el('span',{class:'field-day'},[DAY_LABELS[k]]),
          el('span',{class:'field-date'},[fmtDisplayDate(dates[k])])
        ])
      ]);
      var targetInput = el('input',{class:'num-input', type:'number', min:'0', step:'25', value:draft.days[k].target, oninput:function(e){ draft.days[k].target = e.target.value; renderPreview(); }});
      var actualInput = el('input',{class:'num-input', type:'number', min:'0', step:'25', value:draft.days[k].actual, oninput:function(e){ draft.days[k].actual = e.target.value; renderPreview(); }});
      var wrap = el('div',{style:'display:flex;gap:10px;'},[targetInput, actualInput]);
      row.appendChild(wrap);
      formPanel.appendChild(row);
    });

    var statusMsg = el('span',{class:'status-msg'},['']);
    var saveBtn = el('button',{class:'btn'},['Save week']);
    saveBtn.addEventListener('click', function(){
      saveBtn.disabled = true;
      statusMsg.textContent = 'Saving...';
      statusMsg.className = 'status-msg';
      var newRec = {
        weekStart: today.weekStart,
        weeklyBudget: Number(draft.weeklyBudget)||0,
        days: {},
        updatedAt: new Date().toISOString()
      };
      DAY_KEYS.forEach(function(k){
        newRec.days[k] = { target: Number(draft.days[k].target)||0, actual: Number(draft.days[k].actual)||0 };
      });
      saveRecord(slug, newRec, function(err){
        saveBtn.disabled = false;
        if(!err){
          statusMsg.textContent = "Saved. This store's page will show it next time it loads.";
          statusMsg.className = 'status-msg ok';
        } else if(err.message === 'unauthorized'){
          statusMsg.textContent = 'Save key rejected - check WRITE_KEY matches SHARED_KEY in the Apps Script.';
          statusMsg.className = 'status-msg err';
        } else {
          statusMsg.textContent = 'Could not save (' + err.message + '). Try again.';
          statusMsg.className = 'status-msg err';
        }
      });
    });
    formPanel.appendChild(el('div',{class:'save-row'},[saveBtn, statusMsg]));
    if(savedRec.updatedAt){
      formPanel.appendChild(el('div',{class:'status-msg', style:'margin-top:10px;'},['Last saved ' + new Date(savedRec.updatedAt).toLocaleString('en-US',{timeZone:'America/Denver', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) + ' MT']));
    }

    var previewPanel = el('div',{class:'panel'});
    previewPanel.appendChild(el('h2',{},['Live preview - what ' + store.name + ' sees']));
    var previewBody = el('div',{id:'admin-preview-body'});
    previewPanel.appendChild(previewBody);

    function renderPreview(){
      previewBody.innerHTML = '';
      var tmpRec = {
        weekStart: today.weekStart,
        weeklyBudget: Number(draft.weeklyBudget)||0,
        days: {}
      };
      DAY_KEYS.forEach(function(k){
        tmpRec.days[k] = { target:Number(draft.days[k].target)||0, actual:Number(draft.days[k].actual)||0 };
      });
      var m = computeMetrics(tmpRec, today);
      var kpiRow = el('div',{class:'kpi-row', style:'grid-template-columns:1fr;gap:10px;'});
      kpiRow.appendChild(el('div',{class:'kpi'},[el('div',{class:'kpi-label'},['Ordered so far']), el('div',{class:'kpi-value', style:'font-size:22px;'},[money(m.ordered)])]));
      kpiRow.appendChild(el('div',{class:'kpi'},[el('div',{class:'kpi-label'},['Available today']), el('div',{class:'kpi-value', style:'font-size:22px;'},[today.weekday==='Sun' ? '-' : money(m.availableToday)])]));
      kpiRow.appendChild(el('div',{class:'kpi ' + (m.remaining<0?'danger':'good')},[el('div',{class:'kpi-label'},['Remaining this week']), el('div',{class:'kpi-value', style:'font-size:22px;'},[money(m.remaining)])]));
      previewBody.appendChild(kpiRow);
      var sumTarget = 0;
      DAY_KEYS.forEach(function(k){ sumTarget += Number(draft.days[k].target)||0; });
      var diff = (Number(draft.weeklyBudget)||0) - sumTarget;
      previewBody.appendChild(el('div',{class:'kpi-sub', style:'margin-top:10px;'},[
        'Daily targets total ' + money(sumTarget) + ' (' + (diff===0 ? 'matches weekly budget' : (diff>0 ? money(diff)+' under weekly budget' : money(Math.abs(diff))+' over weekly budget')) + ').'
      ]));
    }
    renderPreview();

    grid.appendChild(formPanel);
    grid.appendChild(previewPanel);
    root.appendChild(grid);
    root.appendChild(el('div',{class:'kpi-sub', style:'margin-top:16px;'},["Bookmark a store's page directly - e.g. the URL ending in #/store/" + slug + " - on that pharmacy's computer."]));
    root.appendChild(footer());
  }
})();
</script>
</body>
</html>
